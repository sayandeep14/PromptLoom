# Releases the Lumine VS Code extension.
#
#   1. bump "version" in Lumine/package.json and add a "## [x.y.z]" entry to Lumine/CHANGELOG.md
#   2. merge to main, then:   git tag lumine-vX.Y.Z && git push origin lumine-vX.Y.Z
#
# The workflow re-runs the tests, checks the tag matches the version, builds the VSIX and
# attaches it to a GitHub Release — that alone is enough for people to download and install it
# manually. Two files are attached: lumine-<version>.vsix and lumine-latest.vsix.
#
# A permanent download link is kept on a separate rolling release named "lumine-latest":
#   https://github.com/<owner>/<repo>/releases/download/lumine-latest/lumine-latest.vsix
# It is updated on every extension release and never depends on GitHub's "Latest release" badge,
# which belongs to the CLI (see release.yml). Extension releases are therefore marked non-latest.
# It publishes to the extension stores only if the matching secret exists (optional):
#   VSCE_PAT  - Azure DevOps personal access token with the "Marketplace (Manage)" scope
#               (publisher must exist: https://marketplace.visualstudio.com/manage)
#   OVSX_PAT  - Open VSX token (https://open-vsx.org/user-settings/tokens; the namespace
#               must exist:  npx ovsx create-namespace <publisher> -p <token>)
# Run it manually (workflow_dispatch) to build and test without publishing anything.
name: Release Lumine

on:
  push:
    tags: ["lumine-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    defaults:
      run:
        working-directory: Lumine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum
      - run: npm install
      - run: npm run typecheck
      - run: npm test

      - name: Check package contents and (for tags) that the tag matches the version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            node scripts/check-vsix.js --tag "${GITHUB_REF_NAME}"
          else
            node scripts/check-vsix.js
          fi

      - name: Build the VSIX
        id: vsix
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npx vsce package --no-dependencies -o "lumine-${VERSION}.vsix"
          cp "lumine-${VERSION}.vsix" lumine-latest.vsix
          echo "file=Lumine/lumine-${VERSION}.vsix" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: lumine-vsix
          path: ${{ steps.vsix.outputs.file }}

      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.vsix.outputs.file }}
            Lumine/lumine-latest.vsix
          name: Lumine ${{ steps.vsix.outputs.version }}
          make_latest: "false"
          body: |
            Install: download `lumine-latest.vsix`, then in VS Code run **Extensions → … → Install from VSIX…**
            or `code --install-extension lumine-latest.vsix`. See the [changelog](https://github.com/${{ github.repository }}/blob/main/Lumine/CHANGELOG.md).
          generate_release_notes: true

      - name: Update the permanent download link (rolling release "lumine-latest")
        if: github.ref_type == 'tag'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.vsix.outputs.version }}
        run: |
          NOTES="Always the newest Lumine build (currently ${VERSION}). Install: download lumine-latest.vsix, then in VS Code run Extensions > ... > Install from VSIX. Versioned releases: lumine-v*."
          if gh release view lumine-latest >/dev/null 2>&1; then
            gh release edit lumine-latest --notes "$NOTES" --latest=false
          else
            gh release create lumine-latest --title "Lumine (latest build)" --notes "$NOTES" --latest=false --target "$GITHUB_SHA"
          fi
          gh release upload lumine-latest Lumine/lumine-latest.vsix --clobber

      - name: Publish to the VS Code Marketplace
        if: github.ref_type == 'tag' && env.VSCE_PAT != ''
        run: npx vsce publish --packagePath "../${{ steps.vsix.outputs.file }}" -p "$VSCE_PAT"

      - name: Publish to Open VSX
        if: github.ref_type == 'tag' && env.OVSX_PAT != ''
        run: npx --yes ovsx publish "../${{ steps.vsix.outputs.file }}" -p "$OVSX_PAT"

      - name: Note skipped publishing
        if: github.ref_type == 'tag' && (env.VSCE_PAT == '' || env.OVSX_PAT == '')
        run: echo "::notice::Store publishing skipped (no VSCE_PAT / OVSX_PAT secret). The VSIX is attached to the GitHub release for manual install."
