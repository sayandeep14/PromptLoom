name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "server", "loomlocker", "libs/gloom"]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  registry-db:
    name: registry (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: loom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d loom_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:pw@localhost:5432/loom_test?sslmode=disable
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: server/go.sum
      - run: go test -count=1 -v ./internal/store/...

  registry-docker:
    name: registry (Docker smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          printf 'POSTGRES_PASSWORD=%s\nUPLOAD_SECRET=%s\nHOST_PORT=18080\n' \
            "$(openssl rand -hex 12)" "$(openssl rand -hex 16)" > .env
          docker compose up -d --build --wait --wait-timeout 120
      - name: Health, auth and read paths
        run: |
          curl -fsS http://127.0.0.1:18080/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/api/v1/vaults -d '{}')" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/v1/vaults)" = 200
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - run: docker compose down -v

  lumine:
    name: Lumine extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lumine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: node build.js
      - run: npm run typecheck
      - name: Unit tests (includes a cross-check against the Go CLI and a real LSP session)
        run: npm test
      - name: Package check (no test/source files in the VSIX, metadata complete)
        run: npm run verify:package
      - name: Build the VSIX
        run: npx vsce package --no-dependencies -o lumine.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: lumine-vsix
          path: Lumine/lumine.vsix
          retention-days: 14
