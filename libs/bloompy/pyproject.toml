[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "bloompy"
version = "0.1.0"
description = "Python client library for LoomLocker — safe secret management in AI-assisted projects"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7", "responses>=0.23"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bloompy*"]
