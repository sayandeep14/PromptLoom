<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="16" height="16" rx="2.5" fill="url(#g)"/>
  <!-- Back card (semi-transparent, offset up-right) -->
  <rect x="5.5" y="2.5" width="8" height="8" rx="1.5"
        fill="white" fill-opacity="0.45"
        stroke="white" stroke-width="0.6" stroke-opacity="0.6"/>
  <!-- Front card (opaque, offset down-left) -->
  <rect x="2.5" y="5.5" width="8" height="8" rx="1.5"
        fill="white" fill-opacity="0.88"/>
  <!-- Lines on front card suggesting field content -->
  <line x1="4.5" y1="8"    x2="8.5" y2="8"    stroke="#8B5CF6" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="4.5" y1="10"   x2="7"   y2="10"   stroke="#8B5CF6" stroke-width="0.9" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="4.5" y1="11.8" x2="8"   y2="11.8" stroke="#8B5CF6" stroke-width="0.9" stroke-linecap="round" stroke-opacity="0.4"/>
</svg>
